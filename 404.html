<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Happy Plant</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Schibsted+Grotesk:wght@400;600&amp;family=DM+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCFDF2;color:#12291B;font-family:'Schibsted Grotesk',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
@keyframes hpWilt{0%,100%{transform:rotate(6deg) translateY(6px)}50%{transform:rotate(8deg) translateY(9px)}}
.mascot{width:170px;transform-origin:50% 92%;animation:hpWilt 5s ease-in-out infinite}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(38px,6vw,64px);line-height:1.05;margin:18px 0 10px}
.hl{display:inline-block;background:#DBFF4A;border-radius:12px;padding:0 14px 3px;transform:rotate(-1.5deg)}
p{font-size:17px;line-height:1.6;color:rgba(18,41,27,.75);margin:0 0 26px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:#12291B;color:#FCFDF2;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;padding:14px 26px 16px;border-radius:999px;border:2px solid #12291B;box-shadow:0 5px 0 #1FB870;transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(3px);box-shadow:0 2px 0 #1FB870}
.drop{display:inline-block;width:12px;height:12px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:#A8ED28}
.mono{font-family:'DM Mono',monospace;font-size:11.5px;letter-spacing:1.5px;color:rgba(18,41,27,.5);margin-top:22px}
</style>
</head>
<body>
<main>
  <img class="mascot" src="/assets/happy-plant-character.svg" alt="A wilting Fern Diesel, the Happy Plant mascot">
  <h1>This page <span class="hl">wilted.</span></h1>
  <p>404. Somebody forgot to water this URL.<br>Fern Diesel is taking it personally.</p>
  <a class="btn" href="/"><span class="drop"></span>Back to the garden</a>
  <p class="mono">ERROR 404 · PLANT NOT FOUND</p>
</main>
</body>
</html>
